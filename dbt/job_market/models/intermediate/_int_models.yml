version: 2

models:
  - name: int_jobs_unioned
    description: >
      All relevant postings from every source, unioned onto one common
      schema. This is the single model every mart is built from.
    columns:
      - name: job_id
        tests:
          - unique
          - not_null
      - name: source
        tests:
          - not_null
      - name: location
        description: >
          Display location: English, via the location_translations seed
          when the source sent it in a non-Latin script. NULL when unknown
          or untranslatable.
      - name: source_location
        description: The location as the source sent it, after whitespace and trailing-comma cleanup.
