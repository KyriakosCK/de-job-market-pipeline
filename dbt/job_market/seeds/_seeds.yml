version: 2

seeds:
  - name: skill_keywords
    description: >
      Reference taxonomy of data/software engineering skills and the
      lowercase keyword used to detect each one in a posting's tags or
      description. Maintained by hand -- extend this list to track new
      tools without touching any model code.
    columns:
      - name: skill_name
        tests:
          - unique
          - not_null
      - name: match_keyword
        tests:
          - unique
          - not_null

  - name: location_translations
    description: >
      English names for locations that RemoteOK publishes only in the local
      script (Arabic, Korean, Japanese). source_location must match
      int_jobs_unioned.source_location exactly (whitespace collapsed,
      trailing commas stripped). Anything missing from here shows up in the
      warn-level test assert_locations_translated.
    columns:
      - name: source_location
        tests:
          - unique
          - not_null
      - name: location_en
        tests:
          - not_null

  - name: region_keywords
    description: >
      Maps words found in a posting's location (country, city, or region
      name like "LATAM") to a broad hiring region. A keyword may map to
      more than one region ("americas", "emea"). Matched on word
      boundaries in bridge_job_region.
    columns:
      - name: match_keyword
        tests:
          - not_null
      - name: region
        tests:
          - not_null
