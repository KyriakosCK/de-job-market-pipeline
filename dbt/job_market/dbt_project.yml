name: 'job_market'
version: '1.0.0'
config-version: 2
profile: 'job_market'

vars:
  # A posting counts as active if it was seen in the last N days. The APIs
  # return only their most recent ~100 postings, so a live job can drop out
  # of a run's results well before it closes.
  active_posting_window_days: 14

models:
  job_market:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      fct_skill_demand_daily:
        +materialized: incremental
