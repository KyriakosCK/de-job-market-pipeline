name: 'job_market'
version: '1.0.0'
config-version: 2

profile: 'job_market'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Only postings still seen in the last N days count as "active" for the
  # skill-demand marts. Keeps the dashboard from showing stale postings
  # from a source that stopped listing a job weeks ago.
  active_posting_window_days: 3

models:
  job_market:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      fct_skill_demand_daily:
        +materialized: incremental
